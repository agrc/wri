packages:
  - functions
  - functions/shared
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@vaadin/vaadin-usage-statistics': true
  esbuild: true
  protobufjs: true
  re2: true
  unrs-resolver: true
minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@ugrc/*'
  - joi@18.3.1
